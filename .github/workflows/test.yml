name: test

on:
  workflow_call:

permissions:
  contents: read

env:
  IMAGE: mod_http3-tester:${{ github.sha }}

jobs:
  suite:
    name: suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up buildx
        uses: docker/setup-buildx-action@v4

      - name: Build tester
        uses: docker/build-push-action@v7
        with:
          context: .
          file: container/Containerfile
          build-args: JOBS=4
          target: tester
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha,scope=module

      - name: Run unit
        run: docker run --rm "$IMAGE" ctest --test-dir /src/build --output-on-failure

      - name: Run pytest
        run: |
          mkdir -p logs
          docker run --rm -v "$PWD/logs:/src/build/test/gen" "$IMAGE" pytest -v

      - name: Keep logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: logs/
          retention-days: 14
