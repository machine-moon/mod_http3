name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  version:
    name: version
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Match tag to CMakeLists
        run: |
          version=${GITHUB_REF_NAME#v}
          grep -q "^project(mod_http3 VERSION ${version%%-rc*})$" CMakeLists.txt

  build-linux:
    name: build-linux
    uses: ./.github/workflows/build-linux.yml
    permissions:
      contents: read
      packages: write

  build-windows:
    name: build-windows
    uses: ./.github/workflows/build-windows.yml
    permissions:
      contents: read
      packages: write

  test:
    name: test
    needs: build-linux
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  interop:
    name: interop
    needs: build-linux
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/interop.yml
    with:
      linux-image: ${{ needs.build-linux.outputs.image }}
    permissions:
      contents: read
      packages: write

  pages:
    name: pages
    needs: build-linux
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read

  release:
    name: release
    needs: [version, build-linux, build-windows, test, interop, pages]
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      packages: write
      pages: write
      id-token: write
