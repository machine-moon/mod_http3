name: release

on:
  workflow_call:

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

jobs:
  images:
    name: images
    runs-on: ubuntu-latest

    steps:
      - name: Log in to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Collect tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ghcr.io/${{ github.repository }}-interop
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-rc') }}

      - name: Retag commit builds
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while read -r tag; do
            docker buildx imagetools create -t "$tag" "${tag%:*}:$GITHUB_SHA"
          done <<<"$TAGS"

  pages:
    name: pages
    needs: images
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Configure pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Deploy site
        id: deploy
        uses: actions/deploy-pages@v5

  assets:
    name: assets
    needs: pages
    runs-on: ubuntu-latest

    steps:
      - name: Read version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >>"$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: mod_http3 ${{ steps.version.outputs.value }}
          files: dist/*
          generate_release_notes: true
          draft: ${{ contains(github.ref_name, '-rc') }}
          prerelease: ${{ contains(github.ref_name, '-rc') }}
