name: build-linux

on:
  workflow_call:
    outputs:
      image:
        description: Linux image this build published for the commit.
        value: ${{ jobs.linux.outputs.image }}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}

jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.ref.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialise submodules
        run: |
          git submodule update --init
          git submodule update --init --recursive dependencies/nghttp3

      - name: Set up buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: container/Containerfile.linux
          build-args: JOBS=4
          tags: ${{ env.IMAGE }}-linux
          load: true
          cache-from: type=gha,scope=module
          cache-to: type=gha,scope=module,mode=max

      - name: Push image
        if: github.event_name != 'pull_request'
        run: docker push "$IMAGE-linux"

      - name: Build artifacts
        uses: docker/build-push-action@v7
        with:
          context: .
          file: container/Containerfile.linux
          build-args: JOBS=4
          target: artifacts
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=module

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-linux
          path: dist/
          if-no-files-found: error

      - name: Export image ref
        id: ref
        run: echo "image=$IMAGE-linux" >>"$GITHUB_OUTPUT"
