ServerRoot "/src/dependencies/httpd-dist"
ServerName localhost

#LoadModule mpm_worker_module   modules/mod_mpm_worker.so
#LoadModule mpm_prefork_module  modules/mod_mpm_prefork.so
LoadModule mpm_event_module    modules/mod_mpm_event.so
LoadModule authz_core_module   modules/mod_authz_core.so
LoadModule log_config_module   modules/mod_log_config.so
LoadModule mime_module         modules/mod_mime.so
LoadModule ssl_module          modules/mod_ssl.so
LoadModule unixd_module        modules/mod_unixd.so
LoadModule dir_module          modules/mod_dir.so
LoadModule http3_module        modules/mod_http3.so

EnableMMAP Off

User  daemon
Group daemon

ErrorLog  /proc/self/fd/2
LogLevel  warn http3:info
CustomLog /proc/self/fd/1 "%h %l %u %t \"%r\" %>s %b"

PidFile /tmp/httpd.pid

TypesConfig conf/mime.types

Listen 8443 https

<VirtualHost *:8443>
    ServerName localhost

    SSLEngine on
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          HIGH:!aNULL:!MD5
    SSLCertificateFile      /src/dependencies/httpd-dist/conf/certs/server.crt
    SSLCertificateKeyFile   /src/dependencies/httpd-dist/conf/certs/server.key

    Protocols h3

    H3CertificatePath       /src/dependencies/httpd-dist/conf/certs/server.crt
    H3CertificateKeyPath    /src/dependencies/httpd-dist/conf/certs/server.key
    H3Port                  8443
    H3MaxConnections        100
    H3MaxConcurrentStreams  128
    H3StreamBufferSize      65536
    H3MaxRequestBodySize    10485760
    H3AltSvc                on
    H3AltSvcMaxAge          86400

    DocumentRoot "/src/dependencies/httpd-dist/htdocs"
    DirectoryIndex index.html

    <Directory "/src/dependencies/httpd-dist/htdocs">
        Options None
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
