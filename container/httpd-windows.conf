ServerRoot "C:/httpd"
ServerName localhost

# mpm_winnt is built in.
LoadModule authz_core_module   modules/mod_authz_core.so
LoadModule log_config_module   modules/mod_log_config.so
LoadModule mime_module         modules/mod_mime.so
LoadModule ssl_module          modules/mod_ssl.so
LoadModule dir_module          modules/mod_dir.so
LoadModule http3_module        modules/mod_http3.so

EnableMMAP Off

ErrorLog  "C:/httpd/logs/error.log"
LogLevel  warn http3:info
CustomLog "C:/httpd/logs/access.log" "%h %l %u %t \"%r\" %>s %b"

PidFile "C:/httpd/logs/httpd.pid"

TypesConfig conf/mime.types

Listen ${H3_PORT} https

<VirtualHost *:${H3_PORT}>
    ServerName localhost

    SSLEngine on
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          HIGH:!aNULL:!MD5
    SSLCertificateFile      "C:/httpd/conf/certs/server.crt"
    SSLCertificateKeyFile   "C:/httpd/conf/certs/server.key"

    Protocols h3

    H3CertificatePath       "C:/httpd/conf/certs/server.crt"
    H3CertificateKeyPath    "C:/httpd/conf/certs/server.key"
    H3Port                  ${H3_PORT}
    H3MaxConnections        100
    H3MaxConcurrentStreams  128
    H3StreamBufferSize      65536
    H3MaxRequestBodySize    10485760
    H3AltSvc                on
    H3AltSvcMaxAge          86400

    DocumentRoot "C:/httpd/htdocs"
    DirectoryIndex index.html

    <Directory "C:/httpd/htdocs">
        Options None
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
