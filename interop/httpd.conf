ServerRoot "/src/dependencies/httpd-dist"

LoadModule mpm_event_module    modules/mod_mpm_event.so
LoadModule authz_core_module   modules/mod_authz_core.so
LoadModule log_config_module   modules/mod_log_config.so
LoadModule mime_module         modules/mod_mime.so
LoadModule ssl_module          modules/mod_ssl.so
LoadModule unixd_module        modules/mod_unixd.so
LoadModule dir_module          modules/mod_dir.so
LoadModule http3_module        modules/mod_http3.so

EnableMMAP Off

User  www-data
Group www-data

<IfModule mpm_event_module>
    ServerLimit            1
    StartServers           1
    ThreadsPerChild        64
    MaxRequestWorkers      64
    MinSpareThreads        16
    MaxSpareThreads        128
    MaxConnectionsPerChild 0
</IfModule>

ErrorLog  /logs/httpd_error.log
CustomLog /logs/httpd_access.log "%h %l %u %t \"%r\" %>s %b"
LogLevel  warn http3:debug

PidFile     /tmp/httpd.pid
TypesConfig conf/mime.types
ServerName  server4

Listen 443 https

<VirtualHost *:443>
    ServerName  server4
    ServerAlias server6 server46

    SSLEngine on
    SSLProtocol           all -SSLv3 -TLSv1 -TLSv1.1
    SSLCertificateFile    /interop/certs/cert.pem
    SSLCertificateKeyFile /interop/certs/priv.key

    Protocols h3

    H3Port                 443

    H3MaxConcurrentStreams 1000
    H3MaxConnections       100

    H3HandshakeTimeout     60
    H3IdleTimeout          300

    H3AltSvc off

    Include /interop/testcase.conf

    DocumentRoot "/interop/www"
    <Directory "/interop/www">
        Options None
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
